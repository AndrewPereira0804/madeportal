project_id = "portal-tests"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55434

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = ["http://127.0.0.1:5174/login"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[storage.analytics]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
