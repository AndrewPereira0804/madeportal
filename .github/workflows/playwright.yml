name: Integration Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Check browser test types
      run: npm run test:e2e:types
    - name: Lint browser tests
      run: npx eslint playwright.config.ts tests/e2e/*.ts
    - name: Build app
      run: npm run build
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Check local test safeguards
      run: npm run test:env:guards
    - name: Start disposable local database
      run: npm run test:env:start
    - name: Run RLS integration tests
      run: npm run test:rls
    - name: Verify RLS cleanup
      run: npm run test:env:verify
    - name: Run browser tests
      run: npm run test:e2e
    - name: Stop local services
      if: ${{ always() }}
      run: npm run test:env:stop
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 7
